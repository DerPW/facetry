name: Task
description: A planned piece of work from the roadmap.
labels: ["type:task"]
body:
  - type: input
    id: milestone
    attributes:
      label: Roadmap milestone
      placeholder: e.g. M0.2 — OpenCASCADE builds for Apple and WebAssembly
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What needs to be done? Copy the relevant checklist items from the phase document.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How do we know this is finished?
