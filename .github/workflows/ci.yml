name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EMSDK_VERSION: "6.0.12"
  CLANG_FORMAT_VERSION: "23.1.3"
  NODE_VERSION: "24"

jobs:
  core-macos:
    name: core (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset macos-debug -DFACETRY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset macos-debug
      - name: Test
        run: ctest --preset macos-debug

  core-ios:
    name: core (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build for iOS simulator
        run: |
          cmake --preset ios-simulator -DFACETRY_WARNINGS_AS_ERRORS=ON
          cmake --build --preset ios-simulator
      - name: Build for iOS device
        run: |
          cmake --preset ios-device -DFACETRY_WARNINGS_AS_ERRORS=ON
          cmake --build --preset ios-device

  core-wasm:
    name: core (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          if [ ! -d "$RUNNER_TEMP/emsdk" ]; then
            git clone --depth 1 --branch "$EMSDK_VERSION" \
              https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          fi
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          dirname "$EMSDK_NODE" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset wasm-debug -DFACETRY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset wasm-debug
      - name: Test (Node)
        run: ctest --preset wasm-debug

  apple-app:
    name: Apple app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/apple
        run: xcodegen generate
      - name: Build for iPadOS simulator
        run: >-
          xcodebuild -project apps/apple/Facetry.xcodeproj -scheme Facetry
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build for macOS
        run: >-
          xcodebuild -project apps/apple/Facetry.xcodeproj -scheme Facetry
          -destination 'generic/platform=macOS'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Lint Swift (swift-format)
        run: swift format lint --strict --recursive apps/apple

  web:
    name: web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check and build
        run: npm run build

  format:
    name: format (C++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check C++ formatting (clang-format ${{ env.CLANG_FORMAT_VERSION }})
        run: >-
          git ls-files -- '*.cpp' '*.hpp' '*.h' |
          xargs --no-run-if-empty pipx run --spec "clang-format==$CLANG_FORMAT_VERSION"
          clang-format --dry-run --Werror
